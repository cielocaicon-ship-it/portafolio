<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noche de Espantos — Videojuegos de Cielo Caicedo</title>
  <meta name="description" content="Noche de Espantos, juego de la saga Petunia de Cielo Caicedo. Un campesino y su perrito defienden la finca de los espantos colombianos hasta que cante el gallo a las 6:00 a. m.: la Patasola, la Llorona, el Mohán y muchos más.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tema.js"></script>
</head>
<body class="jugador">

  <!-- Barra para salir del juego y volver al portafolio -->
  <header class="jugador__barra">
    <nav class="jugador__nav" aria-label="Salir del juego">
      <a class="jugador__volver" href="juegos.html"><span aria-hidden="true">←</span> Volver</a>
      <h1 class="jugador__titulo">Noche de Espantos</h1>
      <details class="jugador__ayuda">
        <summary>Cómo se juega</summary>
        <div class="jugador__ayuda-panel">
          <p>Defiende la finca de los espantos hasta que cante el gallo a las 6:00 a. m.</p>
          <ul>
            <li>Los controles salen en el botón "Cómo jugar" del juego</li>
            <li>Pausa: botón Pausa o <kbd>P</kbd></li>
          </ul>
        </div>
      </details>
      <a class="jugador__inicio" href="index.html" aria-label="Ir al inicio del portafolio"><span class="masthead__mark" aria-hidden="true">CC</span></a>
    </nav>
  </header>

  <main class="jugador__pantalla">
    <iframe class="jugador__juego" id="juego" src="juegos/noche-de-espantos/index.html"
            title="Noche de Espantos" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope" allowfullscreen></iframe>
  </main>

  <script src="js/marcadores.js" defer></script>
  <script src="js/jugador.js" defer></script>

</body>
</html>
